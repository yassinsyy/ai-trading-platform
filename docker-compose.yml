version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: kelisim
      POSTGRES_PASSWORD: kelisim
      POSTGRES_DB: kelisim
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://kelisim:kelisim@db:5432/kelisim
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: kelisim
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      TELEGRAM_BOT_TOKEN: "CHANGE_ME"
      TELEGRAM_WEBAPP_URL: "https://localhost/"
      OPENAI_API_KEY: "sk-..."
      PAYMENT_PROVIDER: "telegram"
      SMS_PROVIDER: "mock"
    depends_on:
      - db
      - minio
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2.7
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./webapp/dist:/srv/webapp:ro
    depends_on:
      - backend

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
