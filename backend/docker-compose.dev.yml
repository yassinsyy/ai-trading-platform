version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: consulting_postgres
    environment:
      POSTGRES_DB: consulting_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - consulting_network

  redis:
    image: redis:7-alpine
    container_name: consulting_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - consulting_network

  # ML Service (Python FastAPI)
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: consulting_ml_service
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ../ml-service:/app
      - ml_models:/app/models
    networks:
      - consulting_network
    depends_on:
      - postgres
      - redis

  # Content Service
  content-service:
    build:
      context: ../content-service
      dockerfile: Dockerfile
    container_name: consulting_content_service
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ../content-service:/app
    networks:
      - consulting_network
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  ml_models:

networks:
  consulting_network:
    driver: bridge
